[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php -d memory_limit=512M /var/www/artisan queue:work --once --queue=sheet-sync,emails,google_calendar,google_contact,google_drive,google_map,imports,sms,default --delay=0 --memory=128 --sleep=3 --tries=3 --timeout=3600
user=www-data
numprocs=8
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/var/www/storage/logs/worker.log
stderr_logfile=/var/www/storage/logs/worker-err.log
stopwaitsecs=3600
