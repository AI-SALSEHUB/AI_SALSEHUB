name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy-prod
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  OWNER: ai-salsehub
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          build-args: |
            MIX_GOOGLE_MAP_API_KEY=${{ secrets.MIX_GOOGLE_MAP_API_KEY }}
            MIX_GOOGLE_CLIENT_ID=${{ secrets.MIX_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/ai-salsehub/ai_salsehub-app:latest
            ghcr.io/ai-salsehub/ai_salsehub-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          build-args: |
            MIX_GOOGLE_MAP_API_KEY=${{ secrets.MIX_GOOGLE_MAP_API_KEY }}
            MIX_GOOGLE_CLIENT_ID=${{ secrets.MIX_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/ai-salsehub/ai_salsehub-web:latest
            ghcr.io/ai-salsehub/ai_salsehub-web:${{ github.sha }}
          cache-from: type=gha
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copier compose + config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: /opt/saleshub
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/saleshub
            echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan queue:restart
            docker image prune -f
